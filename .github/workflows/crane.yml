name: Copy tags from Bitnami to GHCR

on:
  workflow_dispatch:
    inputs:
      containers:
        description: "Comma-separated list of Chart names to sync (e.g: keycloak, nats, valkey)"
        required: true
        type: string

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: generate-matrix
        env:
          CONTAINERS_INPUT: ${{ github.event.inputs.containers }}
        run: |
          # Parse comma-separated input into array
          containers_input="${CONTAINERS_INPUT}"
          echo "Input containers: $containers_input"

          # Convert comma-separated string to JSON array
          # Remove spaces around commas and convert to JSON
          containers_json=$(echo "$containers_input" | sed 's/[[:space:]]*,[[:space:]]*/\n/g' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({"chart": .})')

          echo "Generated matrix JSON: '$containers_json'"

          echo "matrix=$containers_json" >> $GITHUB_OUTPUT

  crane:
    name: Copy ${{ matrix.chart }}
    runs-on: ubuntu-24.04
    needs: generate-matrix
    permissions:
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        # Matrix is generated dynamically from user input
        # Example: [{"chart": "keycloak"}, {"chart": "nats"}, {"chart": "valkey"}]
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      - uses: imjasonh/setup-crane@6da1ae018866400525525ce74ff892880c099987 # v0.5
      - name: Copy ${{ matrix.chart }}
        env:
          CHART: ${{ matrix.chart }}
          REPO: docker.io/bitnamicharts
        run: |-
          crane ls ${REPO}/${CHART} | grep -v '^sha256-' | parallel --will-cite -j4 --no-run-if-empty \
            'crane copy --no-clobber ${REPO}/${CHART}:{} ghcr.io/${{ github.repository_owner }}/bitnami-oss-charts/${CHART}:{} || echo "::warning::Failed to copy ${REPO}/${CHART}:{}"'
